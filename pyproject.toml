[project]
name = "invoice-generator"
version = "0.1.0"
description = "Generate PDF invoices from Google Calendar events"
readme = "README.md"
requires-python = ">=3.10"
# Direct dependencies only, as compatibility floors: `uv.lock` pins the
# exact versions, and `uv lock --upgrade` is how they move.
dependencies = [
    "beautifulsoup4>=4.12.3",
    "google-api-python-client>=2.144.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "jinja2>=3.1.4",
    "pandas>=2.2.2",
    "pydantic[email]>=2.0",
    "rich>=13.9.4",
    "weasyprint>=63.0",
]

[project.scripts]
generate-invoices = "invoice_generator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.1.0",
    "types-beautifulsoup4",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
# Linting only, deliberately no formatter: line length (E5) and import
# order (I) are left to the author. `target-version` is inferred from
# `requires-python`.
#   E4/E7/E9 + F  pyflakes and the pycodestyle errors worth enforcing
#   B             bugbear: likely mistakes rather than style
#   UP            syntax now that the floor is 3.10
#   SIM           simplifications that remove code
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    # Import test modules by path rather than by package, so `tests/` needs
    # no `__init__.py` and the repository root is never put on `sys.path` —
    # the tests exercise the installed package, which is the point of a
    # src-layout
    "--import-mode=importlib",
]
filterwarnings = [
    # httplib2 (a google-api-python-client dependency) still calls
    # pyparsing's deprecated camelCase API at import time. Nothing we can
    # fix here, and there is no fixed httplib2 release yet.
    "ignore::DeprecationWarning:httplib2.auth",
]

[tool.coverage.run]
source = ["invoice_generator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_generator"]
