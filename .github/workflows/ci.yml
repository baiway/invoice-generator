name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in `requires-python`, and the current release
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      # WeasyPrint loads these with dlopen() at import time; the Python
      # package does not bundle them. See `weasyprint_libs.py` for the
      # equivalent problem on macOS.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--locked` fails if uv.lock is out of date with pyproject.toml,
      # rather than silently re-resolving
      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src/ generate-invoices.py

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
