name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in `requires-python`, and the current release
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      # WeasyPrint loads these with dlopen() at import time; the Python
      # package does not bundle them. See `weasyprint_libs.py` for the
      # equivalent problem on macOS.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      # Pinned to an exact release: setup-uv publishes no floating major
      # tag past v7, so `@v10` does not resolve
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # `--locked` fails if uv.lock is out of date with pyproject.toml
      # rather than silently re-resolving. `--no-build` fails fast if a
      # dependency has no wheel for this Python, rather than spending
      # minutes compiling one and failing in the C compiler.
      - name: Install the project
        run: uv sync --locked --no-build --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src/ generate-invoices.py

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
